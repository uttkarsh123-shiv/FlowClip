<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="64" fill="url(#grad1)" opacity="0.1"/>
  
  <!-- Main clip shape -->
  <g transform="translate(64, 64)">
    <!-- Left clip arm -->
    <path d="M -20 -15 Q -25 -15 -25 -10 L -25 10 Q -25 15 -20 15 L -8 15 Q -3 15 -3 10 L -3 -10 Q -3 -15 -8 -15 Z" 
          fill="url(#grad1)" stroke="none"/>
    
    <!-- Right clip arm -->
    <path d="M 20 -15 Q 25 -15 25 -10 L 25 10 Q 25 15 20 15 L 8 15 Q 3 15 3 10 L 3 -10 Q 3 -15 8 -15 Z" 
          fill="url(#grad1)" stroke="none"/>
    
    <!-- Center spring -->
    <path d="M -3 -8 Q 0 -12 3 -8 M -3 0 Q 0 -4 3 0 M -3 8 Q 0 4 3 8" 
          stroke="url(#grad1)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- Flow lines (representing movement) -->
    <g opacity="0.7">
      <path d="M -15 -25 Q -10 -30 -5 -25" stroke="url(#grad1)" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M 5 -25 Q 10 -30 15 -25" stroke="url(#grad1)" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M -15 25 Q -10 30 -5 25" stroke="url(#grad1)" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M 5 25 Q 10 30 15 25" stroke="url(#grad1)" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
  </g>
</svg>