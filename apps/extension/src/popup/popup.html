<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>FlowClip</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        width: 340px;
        min-height: 400px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f0f0f;
        color: #f0f0f0;
      }

      /* ── Header ── */
      header {
        padding: 14px 16px;
        border-bottom: 1px solid #222;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      header h1 { font-size: 16px; font-weight: 600; letter-spacing: 0.5px; }
      header span { font-size: 11px; color: #666; }
      #logout-btn {
        background: none;
        border: 1px solid #333;
        color: #888;
        font-size: 11px;
        padding: 4px 10px;
        border-radius: 4px;
        cursor: pointer;
        display: none;
      }
      #logout-btn:hover { color: #f0f0f0; border-color: #555; }

      /* ── Login view ── */
      #login-view {
        padding: 24px 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      #login-view h2 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
      #login-view p { font-size: 12px; color: #666; margin-bottom: 8px; }
      .field { display: flex; flex-direction: column; gap: 5px; }
      .field label { font-size: 11px; color: #888; }
      .field input {
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 6px;
        color: #f0f0f0;
        font-size: 13px;
        padding: 8px 10px;
        outline: none;
        width: 100%;
      }
      .field input:focus { border-color: #4f46e5; }
      #login-btn {
        background: #4f46e5;
        border: none;
        border-radius: 6px;
        color: #fff;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        padding: 9px;
        margin-top: 4px;
      }
      #login-btn:disabled { background: #3730a3; cursor: not-allowed; }
      #login-error { font-size: 12px; color: #f87171; min-height: 16px; }

      /* ── Clips view ── */
      #clips-view { display: none; }
      #search {
        width: 100%;
        padding: 10px 16px;
        background: #1a1a1a;
        border: none;
        border-bottom: 1px solid #222;
        color: #f0f0f0;
        font-size: 13px;
        outline: none;
      }
      #search::placeholder { color: #555; }
      #clips { overflow-y: auto; max-height: 320px; }
      .clip {
        padding: 10px 16px;
        border-bottom: 1px solid #1a1a1a;
        cursor: pointer;
        font-size: 13px;
        line-height: 1.4;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: background 0.15s;
      }
      .clip:hover { background: #1e1e1e; }
      .clip .time { font-size: 10px; color: #555; margin-top: 3px; }
      #empty {
        padding: 40px 16px;
        text-align: center;
        color: #444;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>FlowClip</h1>
      <div style="display:flex;align-items:center;gap:8px;">
        <span id="count"></span>
        <button id="logout-btn">Logout</button>
      </div>
    </header>

    <!-- Login view -->
    <div id="login-view">
      <div>
        <h2>Sign in</h2>
        <p>Login to start saving clips</p>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" />
      </div>
      <div id="login-error"></div>
      <button id="login-btn">Sign in</button>
    </div>

    <!-- Clips view -->
    <div id="clips-view">
      <input id="search" type="text" placeholder="Search clips..." />
      <div id="clips"><div id="empty">No clips yet. Start copying.</div></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
