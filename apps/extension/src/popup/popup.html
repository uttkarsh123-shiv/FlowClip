<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>FlowClip</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        width: 380px;
        min-height: 520px;
        font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fff;
        color: #000;
      }

      /* ── Header ── */
      header {
        padding: 18px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #f0f0f0;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .logo-icon {
        width: 30px;
        height: 30px;
        background: #10b981;
        border-radius: 7px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 900;
        color: #fff;
      }
      .logo-name {
        font-size: 15px;
        font-weight: 900;
        color: #000;
        letter-spacing: -0.3px;
      }
      .header-right {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #count {
        font-size: 12px;
        color: #999;
        font-weight: 600;
        background: #f5f5f5;
        padding: 4px 10px;
        border-radius: 20px;
      }
      #logout-btn {
        background: #f5f5f5;
        border: none;
        color: #666;
        font-size: 12px;
        padding: 5px 12px;
        border-radius: 20px;
        cursor: pointer;
        display: none;
        font-weight: 600;
        transition: all 0.2s;
      }
      #logout-btn:hover {
        background: #fee2e2;
        color: #dc2626;
      }

      /* ── Login view ── */
      #login-view {
        padding: 28px 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      #login-view h2 {
        font-size: 20px;
        font-weight: 900;
        color: #000;
        letter-spacing: -0.5px;
      }
      #login-view p {
        font-size: 13px;
        color: #888;
        margin-top: -8px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .field label {
        font-size: 12px;
        font-weight: 700;
        color: #000;
      }
      .field input {
        background: #f9fafb;
        border: 1px solid #e5e5e5;
        border-radius: 8px;
        color: #000;
        font-size: 14px;
        padding: 10px 12px;
        outline: none;
        width: 100%;
        transition: all 0.2s;
        font-family: inherit;
      }
      .field input:focus {
        border-color: #10b981;
        background: #fff;
      }
      #login-btn {
        background: #10b981;
        border: none;
        border-radius: 8px;
        color: #fff;
        cursor: pointer;
        font-size: 14px;
        font-weight: 800;
        padding: 12px;
        margin-top: 4px;
        transition: all 0.2s;
        font-family: inherit;
      }
      #login-btn:hover { background: #059669; }
      #login-btn:disabled {
        background: #6ee7b7;
        cursor: not-allowed;
      }
      #login-error {
        font-size: 12px;
        color: #dc2626;
        font-weight: 600;
        min-height: 0;
      }

      /* ── Clips view ── */
      #clips-view {
        display: none;
        flex-direction: column;
      }
      .section-label {
        padding: 16px 20px 10px;
        font-size: 11px;
        font-weight: 700;
        color: #aaa;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      #clips {
        padding: 0 12px 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .clip {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        background: #f9fafb;
        border: 1px solid #f0f0f0;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .clip:hover {
        background: #f0fdf4;
        border-color: #a7f3d0;
      }
      .clip-icon {
        width: 36px;
        height: 36px;
        border-radius: 9px;
        background: #fff;
        border: 1px solid #e5e5e5;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 700;
        color: #000;
        flex-shrink: 0;
      }
      .clip.link .clip-icon { background: #ecfdf5; border-color: #a7f3d0; color: #10b981; }
      .clip.image .clip-icon { background: #eff6ff; border-color: #bfdbfe; color: #3b82f6; }
      .clip-content { flex: 1; min-width: 0; }
      .clip-text {
        font-size: 13px;
        color: #000;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 3px;
      }
      .clip-time {
        font-size: 11px;
        color: #aaa;
        font-weight: 500;
      }
      #empty {
        padding: 40px 24px;
        text-align: center;
        color: #aaa;
        font-size: 13px;
        font-weight: 500;
      }

      /* ── Open dashboard link ── */
      .open-dashboard {
        margin: 4px 12px 12px;
        padding: 11px;
        background: #10b981;
        border: none;
        border-radius: 10px;
        color: #fff;
        font-size: 13px;
        font-weight: 800;
        cursor: pointer;
        width: calc(100% - 24px);
        font-family: inherit;
        transition: all 0.2s;
      }
      .open-dashboard:hover { background: #059669; }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">
        <div class="logo-icon">F</div>
        <span class="logo-name">FlowClip</span>
      </div>
      <div class="header-right">
        <span id="count"></span>
        <button id="logout-btn">Sign out</button>
      </div>
    </header>

    <!-- Login view -->
    <div id="login-view">
      <div>
        <h2>Welcome back</h2>
        <p>Sign in to access your clips</p>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" />
      </div>
      <div id="login-error"></div>
      <button id="login-btn">Sign in</button>
    </div>

    <!-- Clips view -->
    <div id="clips-view">
      <div class="section-label">Recent Captures</div>
      <div id="clips">
        <div id="empty">No clips yet. Start capturing!</div>
      </div>
      <button class="open-dashboard" id="open-dashboard">Open Dashboard</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
